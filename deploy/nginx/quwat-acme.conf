server {
    listen 80;
    listen [::]:80;
    server_name quwat.tech www.quwat.tech api.quwat.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/quwat-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
