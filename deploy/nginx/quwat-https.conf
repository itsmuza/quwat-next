# These files are included inside Ubuntu Nginx's existing http context.
# Keep all map/log names scoped to Quwat on the shared server.
map $http_upgrade $quwat_connection_upgrade {
    default upgrade;
    '' close;
}

# The API port is loopback-only. Enforce the production browser-origin
# allowlist here for both HTTP (including preflight) and WebSocket upgrades.
# Requests without Origin remain available to CLI/server clients; auth stays
# in the application. Never treat this check as authentication.
map $http_origin $quwat_origin_allowed {
    default 0;
    '' 1;
    'https://quwat.tech' 1;
    'https://www.quwat.tech' 1;
}

# WebSocket URLs carry a token: omit queries and Referer from API access logs.
log_format quwat_api_no_args '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.quwat.tech;
    ssl_certificate /etc/letsencrypt/live/quwat.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quwat.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://quwat.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quwat.tech;
    ssl_certificate /etc/letsencrypt/live/quwat.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quwat.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/quwat-web-access.log;
    error_log /var/log/nginx/quwat-web-error.log;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.quwat.tech;
    ssl_certificate /etc/letsencrypt/live/quwat.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quwat.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/quwat-api-access.log quwat_api_no_args;
    error_log /var/log/nginx/quwat-api-error.log;
    client_max_body_size 160m;

    if ($quwat_origin_allowed = 0) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:4107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $quwat_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
