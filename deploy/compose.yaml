name: quwat

x-runtime: &runtime
  restart: unless-stopped
  init: true
  cpus: 1.0
  mem_limit: 1g
  pids_limit: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  stop_grace_period: 30s

services:
  api:
    <<: *runtime
    build:
      context: ../../backend
      dockerfile: ../frontend/deploy/backend.Dockerfile
      args:
        APP_UID: ${QUWAT_UID:?Run deploy/prepare.sh as muza first}
        APP_GID: ${QUWAT_GID:?Run deploy/prepare.sh as muza first}
    environment:
      NODE_ENV: production
      PORT_API: "3007"
    ports:
      - "127.0.0.1:4107:3007"
    volumes:
      - type: bind
        source: ../../secrets/backend.env
        target: /app/.env.production.local
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../shared/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3007/', {signal: AbortSignal.timeout(4000)}).then(async r => process.exit(r.ok && (await r.text()).includes('Welcome Quwat API server!') ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        APP_UID: ${QUWAT_UID:?Run deploy/prepare.sh as muza first}
        APP_GID: ${QUWAT_GID:?Run deploy/prepare.sh as muza first}
        REACT_APP_API_URL: https://api.quwat.tech
        REACT_APP_API_GRAPHQL_URL: https://api.quwat.tech/graphql
        REACT_APP_API_WS: wss://api.quwat.tech
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:4100:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
